name: browser-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-playtest:
    name: اجرای بازی در مرورگر موبایل (۳۹۰×۸۴۴)
    runs-on: ubuntu-latest
    # قلابِ window.__game فقط در بیلدِ تست وجود دارد؛ نسخه‌ی منتشرشده آن را ندارد (مورد ۶)
    env:
      NEXT_PUBLIC_E2E: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: نصب مرورگر Playwright (کروم + وِب‌کیت برای پروفایل iOS)
        run: npx playwright install --with-deps chromium webkit
      - name: اجرای تست‌های موبایل
        run: npx playwright test
      - name: آپلود اسکرین‌شات‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-shots
          path: docs/shots/
          if-no-files-found: ignore
          retention-days: 30
      - name: آپلودِ ردِ کاملِ تست‌های شکست‌خورده (trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
