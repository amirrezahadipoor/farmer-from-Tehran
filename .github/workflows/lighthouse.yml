name: lighthouse

# P6.5: «Lighthouse ≥ ۹۵ در همه‌ی شاخص‌ها» روی رانرِ تمیزِ گیت‌هاب سنجیده می‌شود (نه ماشینِ توسعه):
# پروفایلِ موبایلِ پیش‌فرضِ Lighthouse 12 (شبیه‌سازیِ 4G کند و CPU×۴)، ۵ اجرا و میانه‌ی هر شاخص.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse موبایل (میانه‌ی ۵ اجرا، هدف ≥ ۹۵)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: بیلدِ منتشرشده قلابِ تست ندارد (مورد ۶)
        run: |
          if grep -l "__game" .next/static/chunks/*.js; then echo "window.__game در بیلدِ منتشرشده مانده است"; exit 1; fi
          echo "قلابِ تست در هیچ چانکی نیست"
      - name: اجرای سرورِ تولید
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - name: Lighthouse × ۵
        # یک اجرای گرم‌کنِ کنارگذاشته پیش از ۵ اجرای شمرده‌شده: اولین اجرای Chrome روی رانرِ سرد
        # همه‌چیز را یکنواخت کُند می‌کند (کارِ رشته‌ی اصلی ~۴ برابر، حتی بخشِ Unattributable؛ TTFB فقط ۷ms)
        # و در اجرای a49d8f9 عددِ ۷۰ داد در حالی که چهار اجرای بعدی ۹۸ تا ۹۹ بودند.
        run: |
          mkdir -p lh
          npx --yes lighthouse@12 http://127.0.0.1:3000/ --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance --output=json --output-path=/tmp/lh-warmup.json
          for i in 1 2 3 4 5; do
            npx --yes lighthouse@12 http://127.0.0.1:3000/ --quiet \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html --output-path="lh/run-$i"
          done
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: میانه و بررسیِ آستانه
        # shell: bash یعنی `-eo pipefail`؛ بدونِ آن کدِ خروجیِ ۱ِ ابزار پشتِ tee گم می‌شد و آستانه هیچ‌وقت شکست نمی‌خورد.
        # جدول هم در لاگ چاپ می‌شود، هم در خلاصه‌ی اجرا و هم در آرتیفکت.
        shell: bash
        run: node tools/lighthouse-median.mjs lh 95 | tee lh/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: آپلود گزارش‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lh/
          retention-days: 30
