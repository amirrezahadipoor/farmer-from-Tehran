name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── بلاک‌کننده‌ها: اگر این‌ها سبز نباشند، پوش پذیرفته نمی‌شود
  verify:
    name: typecheck · lint · build · test · assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # P5.13: Postgresِ واقعی فقط برای تستِ امنیتِ سیو (tests/save-pg.test.ts)؛ بیلد و سلامت بدون آن
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (بلاک‌کننده از P5.10 — صفر خطا، صفر هشدار)
        run: npm run lint
      - name: lint متن فارسی (P5.9 — صفر مورد غیرفارسی)
        run: npm run lint:text
      - name: Assets (تصاویر و فونت‌های گم‌شده)
        run: npm run check-assets
      # P5.11 آستانه‌ی ۸۰٪ · P5.13/R/T7: سیو روی Postgresِ واقعی (در محلی، PGlite جایگزین می‌شود)
      - name: Unit tests + پوشش منطق + سیو روی Postgresِ واقعی
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/farm_test
      - name: Build (بدون هیچ متغیر محیطی)
        run: npm run build
      - name: راه‌اندازی و تست سلامت سرور
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ | head -c 200
          curl -sf http://127.0.0.1:3000/api/health
