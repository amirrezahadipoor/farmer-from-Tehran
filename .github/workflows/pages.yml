name: pages

# مورد ۲ِ نقشه‌ی راه: دموی عمومی روی GitHub Pages
# https://amirrezahadipoor.github.io/farmer-from-Tehran/
# نسخه‌ی ایستا (output: export) زیرِ مسیرِ پایه، بدونِ API: ذخیره فقط روی دستگاهِ بازیکن است.
# بعد از انتشار، تستِ دود روی همان آدرسِ عمومی اجرا می‌شود (tools/demo/demo.spec.ts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: بیلدِ ایستا
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: بیلد برای GitHub Pages
        # مسیرهای API در نسخه‌ی ایستا وجود ندارند (output: export از route handlerِ پویا پشتیبانی نمی‌کند)
        run: |
          rm -rf src/app/api
          npm run build
          touch out/.nojekyll
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /farmer-from-Tehran
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    name: انتشار
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: تستِ دود روی آدرسِ عمومی
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c tools/demo/playwright.config.ts
        env:
          DEMO_URL: https://amirrezahadipoor.github.io/farmer-from-Tehran/
      - name: آپلودِ اسکرین‌شاتِ دمو
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-shots
          path: docs/shots/
          if-no-files-found: ignore
          retention-days: 30
