name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  audit:
    # مورد ۱: این بررسی دیگر خاموش نیست (قبلاً هم continue-on-error داشت و هم «|| true»).
    # آسیب‌پذیریِ بالا یا بحرانی در وابستگی‌ها push را قرمز می‌کند؛ رفعِ خودکار با Dependabot.
    name: npm audit (بلاک‌کننده از سطحِ بالا)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: وابستگی‌های production (آنچه به کاربر می‌رسد)
        run: npm audit --omit=dev --audit-level=high
      - name: همه‌ی وابستگی‌ها، از جمله ابزارهای توسعه
        run: npm audit --audit-level=high
